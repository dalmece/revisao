
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Amigo Pet</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <header>
        <h1>Clínica Veterinária Amigo Pet</h1>
    </header>

    <main>
        <section class="cartao">

            <h2>Agendamento de Consulta</h2>

            <img 
                src="foto-destaque.jpg"
                class="foto-destaque"
                alt="Dois cachorros caminhando juntos"
            >

            <p>Cuide da saúde do seu melhor amigo com carinho.</p>

            <form>

                <label for="nome">Nome do Tutor:</label>
                <input 
                    type="text"
                    id="nome"
                    name="nome"
                    required
                    minlength="3"
                    aria-describedby="ajuda-nome"
                >

                <small id="ajuda-nome">
                    Digite o nome completo do responsável.
                </small>

                <br><br>

                <label for="email">E-mail para Contato:</label>
                <input 
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <fieldset>
                    <legend>Espécie do Animal:</legend>

                    <input type="radio" id="cachorro" name="especie" value="Cachorro">
                    <label for="cachorro">Cachorro</label>

                    <input type="radio" id="gato" name="especie" value="Gato">
                    <label for="gato">Gato</label>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Serviços Desejados:</legend>

                    <input type="checkbox" id="vacinacao" name="servicos" value="Vacinação">
                    <label for="vacinacao">Vacinação</label>

                    <input type="checkbox" id="banho" name="servicos" value="Banho e Tosa">
                    <label for="banho">Banho e Tosa</label>
                </fieldset>

                <br>

                <button 
                    type="submit"
                    aria-label="Confirmar agendamento da consulta veterinária"
                >
                    Agendar Consulta
                </button>

            </form>

        </section>
    </main>
</body>
</html>
